# Built by scripts/package-desktop.sh, which stages the backend and its FFmpeg libraries in staging/bin first.
appId: io.github.rasmusrynell.ax-devil
productName: ax-devil
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
publish: null
directories:
  output: dist
# The shell and what --smoke-test needs; tests stay out.
files:
  - "*.cjs"
  - "!*.test.cjs"
  - generated/**
  - package.json
# The backend sits beside the app archive, where a process can be started from (see backendExecutable).
extraResources:
  - from: staging/bin
    to: bin
protocols:
  name: ax-devil
  schemes: [ax-devil]
toolsets:
  appimage: 1.0.3
linux:
  target: AppImage
  category: Utility
win:
  target: zip
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.developer-tools
  hardenedRuntime: false
  identity: "-"
