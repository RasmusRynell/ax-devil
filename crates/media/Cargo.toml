[package]
name = "media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.ax-devil]
layer = "services"

[lints]
workspace = true

# FFmpeg comes from the system libraries (libavcodec, libavformat, libavutil, libswscale); `docs/runbooks/testing.md`
# lists the packages. Only the features this crate uses are linked.
[dependencies]
bytes.workspace = true
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
foundation.workspace = true
sha2 = "0.11"
tracing.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
