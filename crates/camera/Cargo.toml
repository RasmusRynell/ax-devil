[package]
name = "camera"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.ax-devil]
layer = "services"

[lints]
workspace = true

[features]
# `CameraError::fake`, so the app's tests can build the errors a camera would give.
fake = []

[dependencies]
bytes.workspace = true
futures-util = { version = "0.3", default-features = false }
http-auth = { version = "0.1", default-features = false, features = ["basic-scheme", "digest-scheme"] }
# TLS is rustls on the ring provider with certificates unverified (device.rs), so no default provider is installed.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Pinned: the RTSP session, auth and RTCP come from retina; packet assembly is ours (rtsp/assemble.rs), because retina's depacketizers drop the RTP header extension.
retina = "=0.4.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Pinned: the broker connection and the typed refusal codes come from rumqttc. Plain TCP only, as the camera's own MQTT client.
rumqttc = { version = "=0.25.1", default-features = false }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
# The DataHub WebSocket. `__rustls-tls` is the crate's own switch for a caller-supplied rustls config (tls.rs); no roots or provider come with it.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
tracing.workspace = true
# The `log` bridge that `tracing_subscriber`'s `init` installs delivers retina's records to rtsp/keepalive.rs; both are in the app already.
tracing-log = "0.2"
tracing-subscriber.workspace = true
url = "2"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
md-5 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.10"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
