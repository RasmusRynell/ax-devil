name: Audit

# Known vulnerabilities in the locked dependencies. Advisories change without a code change, so this is not part of
# make check or the pull request gate; a red run here is a dependency to update, not a broken commit.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # cargo-deny is built into .tools on first use, which takes a few minutes.
      - name: Audit
        run: make audit
