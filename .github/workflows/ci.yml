name: CI

# make check is the gate, split across parallel Linux jobs: `check` runs everything but the desktop suite, and one
# `desktop` job per smoke group runs that group. The per-OS jobs only build and smoke-test the packaged app.
# A pushed version tag then turns a green run into a draft release.
on:
  push:
    branches: [main, rewrite]
    tags: ["v*"]
  pull_request:
    branches: [main, rewrite]

permissions:
  contents: read

# Superseded PR runs are disposable; every main and rewrite commit and every release keeps its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Chocolatey packages, pinned. The runners' apt and Homebrew packages are not: neither can hold a version.
  MAKE_VERSION: "4.4.1"
  LLVM_VERSION: "20.1.8"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: setup
        uses: ./.github/actions/setup-linux

      - name: Check
        run: make check SKIP_DESKTOP=1

      # Puts the binary the Desktop jobs build into the cache.
      - if: ${{ github.event_name == 'push' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        run: scripts/cargo build --locked --bin ax-devil

      - if: ${{ github.event_name == 'push' && steps.setup.outputs.cargo-cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg-fetch.sh') }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Makefile') }}

  # The groups come from the file the launcher reads, so a group cannot be missing here.
  desktop-groups:
    name: Desktop groups
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - id: groups
        run: echo "groups=$(node -p 'JSON.stringify(Object.keys(require("./desktop/smoke-groups.cjs")))')" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.group }})
    needs: desktop-groups
    runs-on: ubuntu-24.04
    # The largest deadline (media, 15.5 min) plus setup and a cold debug build on a cache miss.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.desktop-groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-linux

      - name: Desktop suite
        run: make test-desktop SMOKE=${{ matrix.group }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.group }}
          path: artifacts/screenshots/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Tool installs and a cold release build, the 50-minute packaged smoke cap, and the uploads.
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-22.04
            ffmpeg: scripts/ffmpeg-fetch.sh linux
            ffmpeg_script: scripts/ffmpeg-fetch.sh
            artifact: desktop/dist/*.AppImage
          - name: win
            runner: windows-2022
            ffmpeg: scripts/ffmpeg-fetch.sh win
            ffmpeg_script: scripts/ffmpeg-fetch.sh
            artifact: desktop/dist/*.zip
          - name: mac
            runner: macos-15
            ffmpeg: scripts/ffmpeg-build-mac.sh
            ffmpeg_script: scripts/ffmpeg-build-mac.sh
            artifact: desktop/dist/*.dmg
            deployment_target: "13.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Built against one FFmpeg: no fallback key, which could restore outputs linked against another.
          key: release-${{ matrix.name }}-${{ matrix.deployment_target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ffmpeg-fetch.sh', 'scripts/ffmpeg-build-mac.sh') }}

      - name: Install the build tools (Linux)
        if: matrix.name == 'linux'
        timeout-minutes: 5
        run: |
          # The script drops the unreachable Azure mirror and sets apt retries and timeouts.
          scripts/apt-install.sh patchelf xauth xvfb clang libclang-dev
          # Ubuntu 22.04 has no such restriction; the setting exists from 23.10 on, as on the CI image.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The Makefile needs GNU make 3.82 or later and the runner's is 3.81.
      - name: Install make (macOS)
        if: matrix.name == 'mac'
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # make runs from Git Bash, as every step does here, so `make package` is the same command on all three systems.
      - name: Install make and find libclang (Windows)
        if: matrix.name == 'win'
        run: |
          choco install make --version="$MAKE_VERSION" -y --no-progress
          llvm='C:\Program Files\LLVM\bin'
          test -f "$llvm/libclang.dll" || choco install llvm --version="$LLVM_VERSION" -y --no-progress
          echo "LIBCLANG_PATH=$llvm" >> "$GITHUB_ENV"

      - name: Choose the FFmpeg folder
        run: echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"

      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-${{ matrix.name }}-${{ matrix.deployment_target }}-${{ hashFiles(matrix.ffmpeg_script) }}

      - name: Get FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: ${{ matrix.ffmpeg }} "$FFMPEG_DIR"

      - name: Build and package
        run: make package OS=${{ matrix.name }}

      # The script runs every smoke group on its own launch, waits as long as the launcher's deadline for each, and prints
      # the logs. This cap ends a script that hangs itself, so it sits above the 44-minute sum of the deadlines
      # (node scripts/smoke-desktop.cjs --plan ''), which are above every scenario's own timeout: a hung scenario is
      # always named first. It must grow with the groups file.
      - name: Smoke-test the package
        timeout-minutes: 50
        run: make smoke-packaged OS=${{ matrix.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-logs-${{ matrix.name }}
          path: artifacts/smoke-logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: artifacts/screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ax-devil-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # A tag that does not name the version of the code fails the run.
  version:
    name: Check the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Check the tag
        run: make verify-release-version TAG="$GITHUB_REF_NAME"

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, desktop, package, version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ax-devil-*
          merge-multiple: true
          path: release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The FFmpeg source behind the shipped libraries, as the LGPL requires.
          scripts/ffmpeg-fetch.sh source release
          scripts/ffmpeg-build-mac.sh source release
          { scripts/ffmpeg-fetch.sh notice; echo; scripts/ffmpeg-build-mac.sh notice; } > release/FFMPEG-LGPL-NOTICE.txt
          (cd release && sha256sum -- * > SHA256SUMS)
          flags=()
          # A tag with a suffix, such as v1.2.0-rc.1, is a prerelease.
          if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag --generate-notes "${flags[@]}" release/*
