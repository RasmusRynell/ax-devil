name: CI

on:
  push:
    branches: [main, rewrite]
    tags: ["v*"]
  pull_request:
    branches: [main, rewrite]

permissions:
  contents: read

# Superseded PR runs are disposable; every main and rewrite commit and every release keeps its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Makefile') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the private display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xauth xvfb

      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check and test
        run: make check

      - name: Fail on stale generated files
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Test frontend and backend
        run: make tests-frontend tests-backend
