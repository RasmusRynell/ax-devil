name: CI

# make check is the gate and runs once, on Linux. The per-OS jobs only build and smoke-test the packaged app.
# A pushed version tag then turns a green run into a draft release.
on:
  push:
    branches: [main, rewrite]
    tags: ["v*"]
  pull_request:
    branches: [main, rewrite]

permissions:
  contents: read

# Superseded PR runs are disposable; every main and rewrite commit and every release keeps its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Chocolatey packages, pinned. The runners' apt and Homebrew packages are not: neither can hold a version.
  MAKE_VERSION: "4.4.1"
  LLVM_VERSION: "20.1.8"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          # target holds outputs linked against one FFmpeg, so the restore prefix names it.
          key: cargo-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg-fetch.sh') }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Makefile') }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg-fetch.sh') }}-

      # The media crate generates its FFmpeg bindings with clang.
      - name: Install the private display and clang
        timeout-minutes: 5
        run: |
          # The Azure mirror stalls; retries and timeouts make update and install fail fast or recover.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-retries
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xauth xvfb clang libclang-dev

      # The pinned FFmpeg the Linux package ships; the loader path is for the test binaries and the app.
      - name: Choose the FFmpeg folder
        run: |
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg/lib" >> "$GITHUB_ENV"

      # The same key as the Linux package job, so the two share one entry.
      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-linux--${{ hashFiles('scripts/ffmpeg-fetch.sh') }}

      - name: Get FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/ffmpeg-fetch.sh linux "$FFMPEG_DIR"

      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check
        run: make check

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-22.04
            ffmpeg: scripts/ffmpeg-fetch.sh linux
            ffmpeg_script: scripts/ffmpeg-fetch.sh
            artifact: desktop/dist/*.AppImage
          - name: win
            runner: windows-2022
            ffmpeg: scripts/ffmpeg-fetch.sh win
            ffmpeg_script: scripts/ffmpeg-fetch.sh
            artifact: desktop/dist/*.zip
          - name: mac
            runner: macos-15
            ffmpeg: scripts/ffmpeg-build-mac.sh
            ffmpeg_script: scripts/ffmpeg-build-mac.sh
            artifact: desktop/dist/*.dmg
            deployment_target: "13.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Built against one FFmpeg: no fallback key, which could restore outputs linked against another.
          key: release-${{ matrix.name }}-${{ matrix.deployment_target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ffmpeg-fetch.sh', 'scripts/ffmpeg-build-mac.sh') }}

      - name: Install the build tools (Linux)
        if: matrix.name == 'linux'
        timeout-minutes: 5
        run: |
          # The Azure mirror stalls; retries and timeouts make update and install fail fast or recover.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-retries
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf xauth xvfb clang libclang-dev
          # Ubuntu 22.04 has no such restriction; the setting exists from 23.10 on, as on the CI image.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The Makefile needs GNU make 3.82 or later and the runner's is 3.81.
      - name: Install make (macOS)
        if: matrix.name == 'mac'
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # make runs from Git Bash, as every step does here, so `make package` is the same command on all three systems.
      - name: Install make and find libclang (Windows)
        if: matrix.name == 'win'
        run: |
          choco install make --version="$MAKE_VERSION" -y --no-progress
          llvm='C:\Program Files\LLVM\bin'
          test -f "$llvm/libclang.dll" || choco install llvm --version="$LLVM_VERSION" -y --no-progress
          echo "LIBCLANG_PATH=$llvm" >> "$GITHUB_ENV"

      - name: Choose the FFmpeg folder
        run: echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"

      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-${{ matrix.name }}-${{ matrix.deployment_target }}-${{ hashFiles(matrix.ffmpeg_script) }}

      - name: Get FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: ${{ matrix.ffmpeg }} "$FFMPEG_DIR"

      - name: Build and package
        run: make package OS=${{ matrix.name }}

      # The script ends the app after three minutes and prints its logs; this ends the script should it hang itself.
      - name: Smoke-test the package
        timeout-minutes: 8
        run: make smoke-packaged OS=${{ matrix.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-logs-${{ matrix.name }}
          path: artifacts/smoke-logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: artifacts/screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ax-devil-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # A tag that does not name the version of the code fails the run.
  version:
    name: Check the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Check the tag
        run: make verify-release-version TAG="$GITHUB_REF_NAME"

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, package, version]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ax-devil-*
          merge-multiple: true
          path: release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The FFmpeg source behind the shipped libraries, as the LGPL requires.
          scripts/ffmpeg-fetch.sh source release
          scripts/ffmpeg-build-mac.sh source release
          { scripts/ffmpeg-fetch.sh notice; echo; scripts/ffmpeg-build-mac.sh notice; } > release/FFMPEG-LGPL-NOTICE.txt
          (cd release && sha256sum -- * > SHA256SUMS)
          flags=()
          # A tag with a suffix, such as v1.2.0-rc.1, is a prerelease.
          if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag --generate-notes "${flags[@]}" release/*
