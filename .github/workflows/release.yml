name: Release

# Pull requests that touch packaging and manual runs build, test and upload the packages for all three systems;
# only a pushed version tag turns them into a draft release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-desktop.sh
      - scripts/check-release-version.sh
      - scripts/smoke-packaged.sh
      - scripts/ffmpeg-*.sh
      - desktop/electron-builder.yml
      - desktop/package.json

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A tag that does not name the version of the code fails before anything is built.
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-version.sh "$TAG"

  package:
    name: Package (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-22.04
            ffmpeg: scripts/ffmpeg-fetch.sh linux
            ffmpeg_script: scripts/ffmpeg-fetch.sh
            artifact: desktop/dist/*.AppImage
          - name: win
            runner: windows-2022
            ffmpeg: scripts/ffmpeg-fetch.sh win
            ffmpeg_script: scripts/ffmpeg-fetch.sh
            artifact: desktop/dist/*.zip
          - name: mac
            runner: macos-15
            ffmpeg: scripts/ffmpeg-build-mac.sh
            ffmpeg_script: scripts/ffmpeg-build-mac.sh
            artifact: desktop/dist/*.dmg
            deployment_target: "13.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Built against one FFmpeg: no fallback key, which could restore outputs linked against another.
          key: release-${{ matrix.name }}-${{ matrix.deployment_target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ffmpeg-fetch.sh', 'scripts/ffmpeg-build-mac.sh') }}

      # The toolchain file names the Rust version; install it up front instead of on the first cargo call.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - name: Install the build tools (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf xauth xvfb clang libclang-dev
          # Ubuntu 22.04 has no such restriction; the setting exists from 23.10 on, as on the CI image.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Find libclang (Windows)
        if: matrix.name == 'win'
        run: |
          llvm='C:\Program Files\LLVM\bin'
          test -f "$llvm/libclang.dll" || choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=$llvm" >> "$GITHUB_ENV"

      - name: Choose the FFmpeg folder
        run: echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"

      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-${{ matrix.name }}-${{ matrix.deployment_target }}-${{ hashFiles(matrix.ffmpeg_script) }}

      - name: Get FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: ${{ matrix.ffmpeg }} "$FFMPEG_DIR"

      - name: Build and package
        run: scripts/package-desktop.sh ${{ matrix.name }}

      - name: Smoke-test the package
        run: scripts/smoke-packaged.sh ${{ matrix.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: artifacts/screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ax-devil-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Draft the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ax-devil-*
          merge-multiple: true
          path: release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/check-release-version.sh "$TAG"
          # The FFmpeg source behind the shipped libraries, as the LGPL requires.
          scripts/ffmpeg-fetch.sh source release
          scripts/ffmpeg-build-mac.sh source release
          { scripts/ffmpeg-fetch.sh notice; echo; scripts/ffmpeg-build-mac.sh notice; } > release/FFMPEG-LGPL-NOTICE.txt
          (cd release && sha256sum -- * > SHA256SUMS)
          flags=()
          # A tag with a suffix, such as v1.2.0-rc.1, is a prerelease.
          if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag --generate-notes "${flags[@]}" release/*
