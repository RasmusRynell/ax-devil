exclude: ^tools/trace-viewer/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: logging-conventions
        name: logging conventions
        entry: uv run python scripts/check_logging.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy src/ax_devil tests tools
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: mixed-line-ending
