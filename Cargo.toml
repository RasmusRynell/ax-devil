[package]
name = "ax-devil"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "ax-devil"

[package.metadata.ax-devil]
layer = "entry"

[workspace]
members = [
  "crates/api-types",
  "crates/foundation",
  "crates/logging",
  "crates/media",
  "crates/playback",
  "crates/sessions",
  "crates/settings",
  "crates/workspace",
  "crates/workspace-store",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
ts-rs = "11"
tracing = "0.1"
tracing-subscriber = "0.3"
api-types = { path = "crates/api-types" }
foundation = { path = "crates/foundation" }
logging = { path = "crates/logging" }
media = { path = "crates/media" }
playback = { path = "crates/playback" }
sessions = { path = "crates/sessions" }
settings = { path = "crates/settings" }
workspace = { path = "crates/workspace" }
workspace-store = { path = "crates/workspace-store" }

[workspace.lints.rust]
missing_docs = "warn"

# App code logs through the logger; the lines `announce` in src/cli.rs prints and the runtime failure in
# src/main.rs are the only allowed prints.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[lints]
workspace = true

[features]
default = ["embed-assets"]
embed-assets = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
api-types.workspace = true
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
clap = { version = "4", features = ["derive"] }
foundation.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
logging.workspace = true
media.workspace = true
playback.workspace = true
serde.workspace = true
serde_json.workspace = true
sessions.workspace = true
settings.workspace = true
tracing.workspace = true
workspace.workspace = true
workspace-store.workspace = true
mime_guess = { version = "2", optional = true }
rust-embed = { version = "8", optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
