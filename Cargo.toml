[package]
name = "ax-devil"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "ax-devil"

[package.metadata.ax-devil]
layer = "entry"

[workspace]
members = [
  "crates/api-types",
  "crates/camera",
  "crates/catalogs",
  "crates/export",
  "crates/foundation",
  "crates/handler-api",
  "crates/handlers",
  "crates/logging",
  "crates/media",
  "crates/overlay-sync",
  "crates/overlays",
  "crates/playback",
  "crates/playlist-resolvers",
  "crates/plugins",
  "crates/scene",
  "crates/scene-decoders",
  "crates/scene-store",
  "crates/sessions",
  "crates/settings",
  "crates/workspace",
  "crates/workspace-files",
  "crates/workspace-store",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
bytes = "1"
crc32fast = "1"
memchr = "2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
quick-xml = "0.42"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = "1"
ts-rs = "11"
tracing = "0.1"
tracing-subscriber = "0.3"
api-types = { path = "crates/api-types" }
camera = { path = "crates/camera" }
catalogs = { path = "crates/catalogs" }
export = { path = "crates/export" }
foundation = { path = "crates/foundation" }
handler-api = { path = "crates/handler-api" }
handlers = { path = "crates/handlers" }
logging = { path = "crates/logging" }
media = { path = "crates/media" }
overlay-sync = { path = "crates/overlay-sync" }
overlays = { path = "crates/overlays" }
playback = { path = "crates/playback" }
playlist-resolvers = { path = "crates/playlist-resolvers" }
plugins = { path = "crates/plugins" }
scene = { path = "crates/scene" }
scene-decoders = { path = "crates/scene-decoders" }
scene-store = { path = "crates/scene-store" }
sessions = { path = "crates/sessions" }
settings = { path = "crates/settings" }
workspace = { path = "crates/workspace" }
workspace-files = { path = "crates/workspace-files" }
workspace-store = { path = "crates/workspace-store" }

# Line tables only: panics and backtraces keep file:line, and test binaries shrink to a fraction of full debuginfo.
[profile.dev]
debug = "line-tables-only"

# No debuginfo for dependencies: they are not what a local backtrace needs.
[profile.dev.package."*"]
debug = false

# Full debuginfo for a debugger: `scripts/cargo build --profile dev-full` (output in target/dev-full).
[profile.dev-full]
inherits = "dev"
debug = true

[profile.dev-full.package."*"]
debug = true

[workspace.lints.rust]
missing_docs = "warn"

# App code logs through the logger; the lines `announce` in src/cli.rs prints and the runtime failure in
# src/main.rs are the only allowed prints.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[lints]
workspace = true

[features]
default = ["embed-assets"]
embed-assets = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
api-types.workspace = true
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
camera.workspace = true
catalogs.workspace = true
clap = { version = "4", features = ["derive", "string"] }
export.workspace = true
foundation.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
handler-api.workspace = true
handlers.workspace = true
logging.workspace = true
media.workspace = true
overlay-sync.workspace = true
overlays.workspace = true
playback.workspace = true
plugins.workspace = true
rustix.workspace = true
scene-store.workspace = true
scene.workspace = true
serde.workspace = true
serde_json.workspace = true
sessions.workspace = true
settings.workspace = true
tracing.workspace = true
workspace.workspace = true
workspace-files.workspace = true
workspace-store.workspace = true
mime_guess = { version = "2", optional = true }
rust-embed = { version = "8", optional = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tungstenite = "0.29"

[dev-dependencies]
# `CameraError::fake`, for the live source tests.
camera = { workspace = true, features = ["fake"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

# Timed with std::time::Instant; run with `make bench-export`.
[[bench]]
name = "export"
harness = false
