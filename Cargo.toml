[package]
name = "ax-devil"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "ax-devil"

[package.metadata.ax-devil]
layer = "entry"

[workspace]
members = [
  "crates/api-types",
  "crates/camera",
  "crates/catalogs",
  "crates/export",
  "crates/foundation",
  "crates/handler-api",
  "crates/handlers",
  "crates/live",
  "crates/logging",
  "crates/media",
  "crates/overlays",
  "crates/playback",
  "crates/plugins",
  "crates/scene",
  "crates/scene-store",
  "crates/sessions",
  "crates/settings",
  "crates/workspace",
  "crates/workspace-files",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
bytes = "1"
crc32fast = "1"
memchr = "2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
quick-xml = "0.42"
rustix = { version = "1", default-features = false, features = ["std", "process"] }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Parses the crates' source for the export-types scan: a hand-written scanner of Rust source is a second parser whose
# misses are silent, which is exactly what that check exists to prevent.
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit"] }
tokio = "1"
ts-rs = "11"
tracing = "0.1"
tracing-subscriber = "0.3"
api-types = { path = "crates/api-types" }
camera = { path = "crates/camera" }
catalogs = { path = "crates/catalogs" }
export = { path = "crates/export" }
foundation = { path = "crates/foundation" }
handler-api = { path = "crates/handler-api" }
handlers = { path = "crates/handlers" }
live = { path = "crates/live" }
logging = { path = "crates/logging" }
media = { path = "crates/media" }
overlays = { path = "crates/overlays" }
playback = { path = "crates/playback" }
plugins = { path = "crates/plugins" }
scene = { path = "crates/scene" }
scene-store = { path = "crates/scene-store" }
sessions = { path = "crates/sessions" }
settings = { path = "crates/settings" }
workspace = { path = "crates/workspace" }
workspace-files = { path = "crates/workspace-files" }

# Line tables only: panics and backtraces keep file:line, and test binaries shrink to a fraction of full debuginfo.
[profile.dev]
debug = "line-tables-only"

# No debuginfo for dependencies: they are not what a local backtrace needs.
[profile.dev.package."*"]
debug = false

# Full debuginfo for a debugger: `scripts/cargo build --profile dev-full` (output in target/dev-full).
[profile.dev-full]
inherits = "dev"
debug = true

[profile.dev-full.package."*"]
debug = true

[workspace.lints.rust]
missing_docs = "warn"

# App code logs through the logger; the lines `announce` in src/cli.rs prints and the runtime failure in
# src/main.rs are the only allowed prints.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[lints]
workspace = true

[features]
default = ["embed-assets"]
embed-assets = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
api-types.workspace = true
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
catalogs.workspace = true
clap = { version = "4", features = ["derive", "string"] }
export.workspace = true
foundation.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
handler-api.workspace = true
handlers.workspace = true
live.workspace = true
logging.workspace = true
media.workspace = true
overlays.workspace = true
playback.workspace = true
plugins.workspace = true
rustix.workspace = true
# Local CLI requests use the server stack, without camera transport or TLS dependencies.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
scene-store.workspace = true
scene.workspace = true
serde.workspace = true
serde_json.workspace = true
sessions.workspace = true
settings.workspace = true
sha2.workspace = true
tracing.workspace = true
workspace.workspace = true
workspace-files.workspace = true
mime_guess = { version = "2", optional = true }
rust-embed = { version = "8", optional = true }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tungstenite = "0.29"

# Opens a plugin's view file from the folder above it, so no link leads out of `views/`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
# Camera values for the tests that build what a scan or a camera answers; only the live crate depends on camera otherwise.
camera.workspace = true
# The fake connector of the live source tests.
live = { workspace = true, features = ["fake"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }

# Timed with std::time::Instant; run with `make bench-export`.
[[bench]]
name = "export"
harness = false
