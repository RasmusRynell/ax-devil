# PR-Agent review settings. Model and trigger settings live in .github/workflows/pr-agent.yml; max_model_tokens here caps how much diff the reviewer sends.
# PR-Agent reads this file from the default branch, so edits apply after merge.

[pr_reviewer]
extra_instructions = """\
This is a Rust backend, React/TypeScript frontend and Electron desktop app. Report only findings a maintainer should act on:
- Logic bugs and incorrect behavior, including edge cases and unhandled error paths (`unwrap`/`expect` on fallible input).
- Security problems, including secrets, unsafe file or network handling, untrusted plugin input, and Electron exposure (IPC, preload, remote-session access, paths from dropped or opened files).
- Concurrency: blocking calls on async tasks, locks held across `.await`, unbounded channels, deadlocks; React effect cleanup and stale closures.
- Performance regressions on frame decode, playback, WebSocket and canvas paint hot paths.
- Contract violations: breaking changes to the Rust `api-types` wire format, workspace files, settings, plugin or CLI behavior. Generated frontend and desktop types are ignored here because `make check` fails when they are stale.
- Missing tests only for deep modules or rules with real user consequences; the repo deliberately avoids shallow tests.
For each finding cite the file and line, say why it matters, and suggest a concrete fix.
Skip style, naming and formatting (rustfmt, clippy and the Vite+ formatter and linter enforce them), compliments and long summaries.
Stay silent when unsure: prefer no finding over a speculative one.
"""
num_max_findings = 5
require_estimate_effort_to_review = false
require_ticket_analysis_review = false
enable_review_labels_security = false
enable_review_labels_effort = false
enable_intro_text = false
persistent_comment = true

[config]
max_model_tokens = 200000

[ignore]
glob = ['Cargo.lock', 'pnpm-lock.yaml', 'frontend/src/generated/*', 'desktop/generated/*']
